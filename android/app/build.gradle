plugins {
    id 'com.android.application'
}

android {
    namespace 'com.expensemanager.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.expensemanager.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }
}